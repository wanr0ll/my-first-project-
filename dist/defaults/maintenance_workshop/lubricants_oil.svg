<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1c1917"/>
      <stop offset="100%" style="stop-color:#292524"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <!-- Oil can body -->
  <rect x="180" y="160" width="100" height="140" rx="10" fill="#f59e0b"/>
  <rect x="170" y="150" width="120" height="30" rx="6" fill="#fbbf24"/>
  <!-- Spout -->
  <rect x="270" y="155" width="70" height="16" rx="8" fill="#d97706" transform="rotate(-25 305 163)"/>
  <!-- Oil drop -->
  <ellipse cx="345" cy="195" rx="10" ry="14" fill="#78350f"/>
  <!-- Bottle 1 -->
  <rect x="320" y="200" width="55" height="100" rx="8" fill="#0ea5e9"/>
  <rect x="325" y="188" width="45" height="22" rx="5" fill="#38bdf8"/>
  <rect x="338" y="176" width="20" height="18" rx="4" fill="#7dd3fc"/>
  <!-- Bottle 2 -->
  <rect x="390" y="210" width="50" height="90" rx="8" fill="#22c55e"/>
  <rect x="395" y="198" width="40" height="20" rx="5" fill="#4ade80"/>
  <rect x="407" y="186" width="18" height="18" rx="4" fill="#86efac"/>
  <!-- Label -->
  <text x="50%" y="370" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#f1f5f9" text-anchor="middle">Lubricants and Oil</text>
</svg>
