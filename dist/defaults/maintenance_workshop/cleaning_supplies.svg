  <path d="M205,218 Q255,175 305,218" fill="none" stroke="#7dd3fc" stroke-width="8" stroke-linecap="round"/>
  <!-- Bubbles in bucket -->
  <circle cx="220" cy="285" r="10" fill="#7dd3fc" opacity="0.5"/>
  <circle cx="255" cy="300" r="7" fill="#7dd3fc" opacity="0.4"/>
  <circle cx="290" cy="275" r="9" fill="#7dd3fc" opacity="0.5"/>
  <!-- Spray bottle -->
  <rect x="355" y="195" width="65" height="110" rx="10" fill="#22c55e"/>
  <rect x="360" y="182" width="50" height="22" rx="6" fill="#4ade80"/>
  <rect x="380" y="165" width="22" height="24" rx="5" fill="#86efac"/>
  <!-- Spray trigger -->
  <path d="M355,230 Q330,240 335,260 L355,260 Z" fill="#16a34a"/>
  <!-- Spray mist -->
  <circle cx="325" cy="220" r="5" fill="#bfdbfe" opacity="0.6"/>
  <circle cx="314" cy="232" r="4" fill="#bfdbfe" opacity="0.5"/>
  <circle cx="308" cy="215" r="3" fill="#bfdbfe" opacity="0.5"/>
  <circle cx="320" cy="240" r="3" fill="#bfdbfe" opacity="0.4"/>
  <!-- Sponge -->
  <rect x="170" y="145" width="80" height="50" rx="10" fill="#fbbf24"/>
  <rect x="175" y="150" width="70" height="12" rx="4" fill="#fcd34d"/>
  <rect x="175" y="168" width="70" height="12" rx="4" fill="#fcd34d"/>
  <!-- Mop -->
  <rect x="445" y="120" width="14" height="200" rx="5" fill="#92400e"/>
  <rect x="430" y="300" width="45" height="30" rx="5" fill="#e5e7eb"/>
  <line x1="433" y1="303" x2="433" y2="328" stroke="#9ca3af" stroke-width="3"/>
  <line x1="443" y1="300" x2="443" y2="330" stroke="#9ca3af" stroke-width="3"/>
  <line x1="452" y1="300" x2="452" y2="330" stroke="#9ca3af" stroke-width="3"/>
  <line x1="461" y1="303" x2="461" y2="328" stroke="#9ca3af" stroke-width="3"/>
  <!-- Label -->
  <text x="50%" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="bold" fill="#f1f5f9" text-anchor="middle">Cleaning Supplies</text>
