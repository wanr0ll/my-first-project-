<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#312e81"/>
      <stop offset="100%" style="stop-color:#1e1b4b"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <!-- Bolt 1 (large) -->
  <rect x="155" y="185" width="90" height="30" rx="5" fill="#94a3b8"/>
  <rect x="155" y="177" width="28" height="46" rx="4" fill="#64748b"/>
  <polygon points="145,177 245,177 240,165 150,165" fill="#94a3b8"/>
  <!-- Bolt thread lines -->
  <line x1="255" y1="188" x2="310" y2="188" stroke="#cbd5e1" stroke-width="5" stroke-dasharray="6,5"/>
  <line x1="255" y1="200" x2="315" y2="200" stroke="#cbd5e1" stroke-width="5" stroke-dasharray="6,5"/>
  <line x1="255" y1="212" x2="310" y2="212" stroke="#cbd5e1" stroke-width="5" stroke-dasharray="6,5"/>
  <!-- Nut -->
  <polygon points="340,175 380,155 420,175 420,225 380,245 340,225" fill="#64748b" stroke="#94a3b8" stroke-width="4"/>
  <circle cx="380" cy="200" r="20" fill="#1e1b4b" stroke="#94a3b8" stroke-width="4"/>
  <!-- Screws -->
  <rect x="155" y="270" width="14" height="60" rx="4" fill="#a78bfa" transform="rotate(-30 162 300)"/>
  <rect x="150" y="262" width="24" height="16" rx="3" fill="#7c3aed" transform="rotate(-30 162 270)"/>
  <rect x="195" y="255" width="14" height="60" rx="4" fill="#a78bfa" transform="rotate(10 202 285)"/>
  <rect x="190" y="247" width="24" height="16" rx="3" fill="#7c3aed" transform="rotate(10 202 255)"/>
  <!-- Washers -->
  <circle cx="430" cy="280" r="32" fill="none" stroke="#c084fc" stroke-width="14"/>
  <circle cx="430" cy="280" r="10" fill="#1e1b4b"/>
  <circle cx="475" cy="255" r="22" fill="none" stroke="#a78bfa" stroke-width="10"/>
  <circle cx="475" cy="255" r="7" fill="#1e1b4b"/>
  <!-- Label -->
  <text x="50%" y="375" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="bold" fill="#f1f5f9" text-anchor="middle">Fasteners &amp; Fixings</text>
</svg>
