      <stop offset="0%" style="stop-color:#1e3a5f"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <!-- Hammer -->
  <rect x="150" y="220" width="130" height="22" rx="8" fill="#92400e" transform="rotate(-40 215 231)"/>
  <rect x="185" y="145" width="70" height="45" rx="8" fill="#78716c"/>
  <rect x="195" y="140" width="50" height="20" rx="5" fill="#a8a29e"/>
