  <rect x="310" y="130" width="16" height="150" rx="6" fill="#f59e0b" transform="rotate(15 318 205)"/>
  <rect x="305" y="125" width="26" height="35" rx="5" fill="#d97706" transform="rotate(15 318 142)"/>
  <rect x="314" y="270" width="8" height="25" rx="2" fill="#64748b" transform="rotate(15 318 282)"/>
