# render.yaml — Render deployment configuration
# Docs: https://render.com/docs/render-yaml-spec
#
# Stack: PHP backend on Render (Docker) + Supabase PostgreSQL + Netlify frontend

services:
  - type: web
    name: gha-asset-manager-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      # Supabase PostgreSQL connection (set these in Render Dashboard > Environment)
      - key: DATABASE_URL
        sync: false   # Set manually: postgresql://postgres:[PASSWORD]@db.[REF].supabase.co:5432/postgres

      # CORS — allow requests from Netlify frontend
      - key: FRONTEND_URL
        sync: false   # Set manually: https://your-site.netlify.app
      - key: CORS_ALLOW_ALL
        value: "false"

      # JWT secret for auth token signing
      - key: JWT_SECRET
        generateValue: true   # Auto-generated by Render

      # Email (Brevo/SendGrid) — set manually in Render dashboard
      - key: BREVO_API_KEY
        sync: false
